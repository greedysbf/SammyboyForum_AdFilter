name: Test Forum Cloudflare Access (nodriver)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Forum domain to test (optional — falls back to FORUM_URL variable)'
        required: false
        type: string

permissions:
  contents: read

env:
  FORUM_URL: ${{ inputs.domain || vars.FORUM_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser xvfb

      - name: Install nodriver
        run: pip install nodriver

      - name: Clone EzSolver
        run: git clone https://github.com/ismoiloffS/EzSolver.git /tmp/ezsolver

      - name: Test access with nodriver
        run: |
          xvfb-run -a python <<'PYEOF'
          import asyncio, os, sys
          import nodriver as uc

          url = os.environ.get('FORUM_URL', '')
          if not url:
              print('RESULT: NO URL PROVIDED')
              sys.exit(1)
          if not url.startswith('http'):
              url = 'https://' + url

          async def main():
              browser = await uc.start(
                  browser_executable_path='/usr/bin/chromium-browser',
                  headless=False,
                  browser_args=[
                      '--disable-dev-shm-usage',
                      '--no-sandbox',
                  ],
              )
              try:
                  page = await browser.get(url)
                  await asyncio.sleep(12)

                  title = await page.evaluate('document.title')
                  body = await page.evaluate('document.body ? document.body.innerText.slice(0, 1500) : ""')
                  print('Page title:', title)
                  print('Page body (first 500):', str(body)[:500])

                  haystack = (str(title) + ' ' + str(body)).lower()
                  challenge = (
                      'performing security verification' in haystack or
                      'just a moment' in haystack or
                      'verify you are human' in haystack or
                      'checking your browser' in haystack
                  )

                  # Try to find a Turnstile sitekey
                  sitekey = await page.evaluate("""
                      (() => {
                          const el = document.querySelector('[data-sitekey]');
                          if (el) return el.getAttribute('data-sitekey');
                          for (const iframe of document.querySelectorAll('iframe')) {
                              const src = iframe.src || iframe.getAttribute('src') || '';
                              const m = src.match(/sitekey=([^&]+)/);
                              if (m) return m[1];
                          }
                          return null;
                      })()
                  """)
                  print('Detected sitekey:', sitekey)

                  if challenge:
                      print('RESULT: CHALLENGE DETECTED')
                      sys.exit(1)
                  else:
                      print('RESULT: PAGE LOADED — NO CHALLENGE')
              finally:
                  await browser.stop()

          asyncio.run(main())
          PYEOF